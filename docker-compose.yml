version: '3.8'

services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      # Required
      - DB_URL=postgres://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/patchli?sslmode=disable
      - REDIS_URL=${REDIS_URL:-redis:6379}
      - JWT_SECRET=${JWT_SECRET:-changeme_jwt_secret}
      - REGISTRATION_SECRET=${REGISTRATION_SECRET:-changeme_reg_secret}
      # Optional
      - PORT=${PORT:-8080}
      - BASE_URL=${BASE_URL:-http://localhost:8080}
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL:-}
      - TEAMS_WEBHOOK_URL=${TEAMS_WEBHOOK_URL:-}
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL:-}
    depends_on:
      - postgres
      - redis
    restart: unless-stopped
    volumes:
      - ./data/server:/app/data

  agent:
    build:
      context: ./agent
      dockerfile: Dockerfile
    environment:
      # Required
      - SERVER_URL=${SERVER_URL:-server:8080}
      # Optional
      - TRUSTED_PUB_KEY=${TRUSTED_PUB_KEY:-}
    depends_on:
      - server
    restart: unless-stopped
    # Use privileged/bind mounts if the agent needs host access
    # privileged: true
    # volumes:
    #   - /:/host:ro

  postgres:
    image: postgres:15-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=patchli
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped
