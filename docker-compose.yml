version: '3.8'

services:
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    ports:
      - "8080:8080"
    environment:
      # Required
      - DB_URL=postgres://postgres:${POSTGRES_PASSWORD:?database password required}@postgres:5432/rpatch?sslmode=disable
      - REDIS_URL=redis://:${REDIS_PASSWORD:?redis password required}@redis:6379
      - JWT_SECRET=${JWT_SECRET:?JWT secret required}
      - REGISTRATION_SECRET=${REGISTRATION_SECRET:?registration secret required}
      # Optional
      # Admin API bearer token (/api/v1/nodes, /api/v1/stats, /api/v1/setup).
      # The admin API returns 401 while it is unset.
      - ADMIN_TOKEN=${ADMIN_TOKEN:-}
      # Base64 Ed25519 key used to sign agent commands (see README).
      - COMMAND_SIGNING_KEY=${COMMAND_SIGNING_KEY:-}
      - TRUSTED_PROXY=${TRUSTED_PROXY:-}
      # Serve HTTPS directly (agents require TLS); paths inside the container,
      # e.g. /app/data/tls/server.crt. The certificate must cover the host
      # name agents use in SERVER_URL.
      - TLS_CERT_FILE=${TLS_CERT_FILE:-}
      - TLS_KEY_FILE=${TLS_KEY_FILE:-}
      - PORT=${PORT:-8080}
      # Must be HTTPS unless it points at localhost/loopback.
      - BASE_URL=${BASE_URL:-http://localhost:8080}
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL:-}
      - TEAMS_WEBHOOK_URL=${TEAMS_WEBHOOK_URL:-}
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped
    volumes:
      - ./data/server:/app/data

  agent:
    build:
      context: ./agent

    environment:
      # Required. HTTPS with a trusted certificate (e.g. via a TLS reverse proxy).
      - SERVER_URL=${SERVER_URL:-server:8080}
      # Optional
      - TRUSTED_PUB_KEY=${TRUSTED_PUB_KEY:-}
      # Public key matching COMMAND_SIGNING_KEY; when set, unsigned commands are rejected.
      - COMMAND_PUB_KEY=${COMMAND_PUB_KEY:-}
    depends_on:
      - server
    restart: unless-stopped
    # Use privileged/bind mounts if the agent needs host access
    # privileged: true
    # volumes:
    #   - /:/host:ro

  postgres:
    image: postgres:15-alpine
    # Only reachable from the compose network and the local host.
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?database password required}
      - POSTGRES_DB=rpatch
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d rpatch"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?redis password required}", "--protected-mode", "yes"]
    # Only reachable from the compose network and the local host.
    ports:
      - "127.0.0.1:6379:6379"
    restart: unless-stopped
