version: '3.8'

services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      # Required
      - DB_URL=postgres://postgres:${POSTGRES_PASSWORD:?database password required}@postgres:5432/patchli?sslmode=disable
      - REDIS_URL=redis://:${REDIS_PASSWORD:?redis password required}@redis:6379
      - JWT_SECRET=${JWT_SECRET:?JWT secret required}
      - REGISTRATION_SECRET=${REGISTRATION_SECRET:?registration secret required}
      # Optional
      # Admin API bearer token (/api/v1/nodes, /api/v1/stats, /api/v1/setup).
      # The admin API returns 401 while it is unset.
      - ADMIN_TOKEN=${ADMIN_TOKEN:-}
      # Base64 Ed25519 key used to sign agent commands (see README).
      - COMMAND_SIGNING_KEY=${COMMAND_SIGNING_KEY:-}
      - TRUSTED_PROXY=${TRUSTED_PROXY:-}
      - PORT=${PORT:-8080}
      # Must be HTTPS unless it points at localhost/loopback.
      - BASE_URL=${BASE_URL:-http://localhost:8080}
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL:-}
      - TEAMS_WEBHOOK_URL=${TEAMS_WEBHOOK_URL:-}
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL:-}
    depends_on:
      - postgres
      - redis
    restart: unless-stopped
    volumes:
      - ./data/server:/app/data

  agent:
    build:
      context: ./agent
      dockerfile: Dockerfile
    environment:
      # Required. HTTPS with a trusted certificate (e.g. via a TLS reverse proxy).
      - SERVER_URL=${SERVER_URL:-server:8080}
      # Optional
      - TRUSTED_PUB_KEY=${TRUSTED_PUB_KEY:-}
      # Public key matching COMMAND_SIGNING_KEY; when set, unsigned commands are rejected.
      - COMMAND_PUB_KEY=${COMMAND_PUB_KEY:-}
    depends_on:
      - server
    restart: unless-stopped
    # Use privileged/bind mounts if the agent needs host access
    # privileged: true
    # volumes:
    #   - /:/host:ro

  postgres:
    image: postgres:15-alpine
    # Only reachable from the compose network and the local host.
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?database password required}
      - POSTGRES_DB=patchli
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?redis password required}", "--protected-mode", "yes"]
    # Only reachable from the compose network and the local host.
    ports:
      - "127.0.0.1:6379:6379"
    restart: unless-stopped
