<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patchli - Settings</title>
    <script src="/assets/js/tailwind.js"></script>
    <link href="/assets/css/fonts.css" rel="stylesheet"/>
    <style>
        body { 
            font-family: 'Quicksand', sans-serif; 
            background: radial-gradient(circle at top left, #0f172a, #134e4a); 
            color: #ccfbf1; 
            min-height: 100vh; 
            margin: 0; 
            display: flex; 
            overflow-x: hidden; 
        } 
        .blob-sidebar { background: rgba(20, 184, 166, 0.05); backdrop-filter: blur(10px); border-right: 1px solid rgba(20, 184, 166, 0.2); } 
        .nav-link { color: #99f6e4; text-decoration: none; padding: 0.4rem 1rem; border-radius: 50px; background: rgba(255, 255, 255, 0.05); transition: all 0.3s ease; font-size: 0.8rem; } 
        .nav-link:hover, .nav-link.active { background: rgba(20, 184, 166, 0.2); color: #fff; }
        .glass-panel { background: rgba(15, 23, 42, 0.4); backdrop-filter: blur(12px); border: 1px solid rgba(20, 184, 166, 0.1); border-radius: 1.5rem; } 
    </style>
</head>
<body>
    <aside class="blob-sidebar w-64 h-screen sticky top-0 flex flex-col p-6 border-r border-teal-900/30">
        <div class="mb-8">
            <h1 class="text-xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-teal-300 to-emerald-500">Fleet.OS</h1>
        </div>
        <nav class="flex flex-col gap-2 mb-12">
            <a class="nav-link" href="/">Dashboard</a>
            <a class="nav-link" href="/setup">Add Agent</a>
            <a class="nav-link" href="/groups">Groups</a>
            <a class="nav-link active" href="/settings">Settings</a>
        </nav>
    </aside>

    <main class="flex-1 p-8 overflow-y-auto">
        <div class="max-w-5xl">
            <header class="mb-8">
                <h2 class="text-3xl font-bold text-teal-100">Global Settings</h2>
                <p class="text-teal-500/60 mt-2">Configure security, webhooks, and core preferences.</p>
            </header>

            <div class="glass-panel p-12 text-center">
                <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-teal-500/10 border border-teal-500/20 mb-6">
                    <svg class="w-8 h-8 text-teal-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                </div>
                <h3 class="text-xl font-bold text-teal-100">Core Settings Restricted</h3>
                <p class="text-teal-500/60 mt-2 max-w-md mx-auto">Access to global parameters is restricted to the root supervisor. Contact your cluster admin.</p>
                <button class="mt-8 bg-teal-500/10 hover:bg-teal-500/20 text-teal-300 px-6 py-2 rounded-full border border-teal-500/20 transition-all" onclick="window.location.href='/'">Return Home</button>
            </div>
        </div>
    </main>
</body>
</html>
