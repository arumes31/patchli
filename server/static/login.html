<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patchli - Secure Login</title>
    <link rel="icon" type="image/png" href="/favicon.png">
    <script src="/assets/js/tailwind.js"></script>
    <link href="/assets/css/fonts.css" rel="stylesheet"/>
    <style>
        body {
            font-family: 'Quicksand', sans-serif;
            background: radial-gradient(circle at top left, #0f172a, #134e4a);
            color: #ccfbf1;
            min-height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* Animated Background Particles */
        .bg-glow {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: 0;
            overflow: hidden;
        }
        .particle {
            position: absolute;
            background: rgba(20, 184, 166, 0.1);
            border-radius: 50%;
            filter: blur(40px);
            animation: drift 20s infinite alternate ease-in-out;
        }
        @keyframes drift {
            from { transform: translate(0, 0) scale(1); }
            to { transform: translate(100px, 100px) scale(1.5); }
        }

        .glass-panel {
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(24px);
            border: 1px solid rgba(20, 184, 166, 0.2);
            border-radius: 2rem;
            width: 100%;
            max-width: 400px;
            padding: 3rem;
            z-index: 10;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .data-mono { font-family: 'JetBrains Mono', monospace; }

        input {
            background: rgba(15, 23, 42, 0.4);
            border: 1px solid rgba(20, 184, 166, 0.1);
            color: #ccfbf1;
            border-radius: 0.75rem;
            padding: 1rem;
            width: 100%;
            outline: none;
            transition: all 0.3s ease;
        }
        input:focus {
            border-color: #5eead4;
            background: rgba(15, 23, 42, 0.6);
            box-shadow: 0 0 15px rgba(20, 184, 166, 0.1);
        }

        button.primary {
            background: linear-gradient(135deg, #10b981, #14b8a6);
            color: #fff;
            font-weight: 700;
            padding: 1rem;
            width: 100%;
            border-radius: 0.75rem;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-top: 1.5rem;
        }
        button.primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 25px rgba(16, 185, 129, 0.5);
        }

        .logo-glow {
            background: linear-gradient(to right, #5eead4, #10b981);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 8px rgba(16, 185, 129, 0.3));
        }
    </style>
</head>
<body>
    <div class="bg-glow">
        <div class="particle" style="width: 400px; height: 400px; top: -100px; left: -100px;"></div>
        <div class="particle" style="width: 300px; height: 300px; bottom: -50px; right: -50px; animation-delay: -5s;"></div>
        <div class="particle" style="width: 200px; height: 200px; top: 40%; left: 60%; animation-delay: -10s;"></div>
    </div>

    <div class="glass-panel text-center">
        <header class="mb-10">
            <div class="flex flex-col items-center gap-4">
                <img src="/assets/img/logo.png" alt="Patchli Logo" class="w-20 h-20 object-contain drop-shadow-[0_0_15px_rgba(20,184,166,0.3)]">
                <h1 class="text-3xl font-bold logo-glow">Patchli</h1>
            </div>
        </header>

        <form class="space-y-6 text-left">
            <div>
                <label class="text-[10px] uppercase tracking-tighter text-teal-500 font-bold mb-1 block ml-2">Username</label>
                <input type="text" placeholder="Username or Email" class="data-mono text-sm"/>
            </div>
            <div>
                <label class="text-[10px] uppercase tracking-tighter text-teal-500 font-bold mb-1 block ml-2">Password</label>
                <input type="password" placeholder="••••••••" class="data-mono text-sm"/>
            </div>

            <button type="submit" class="primary data-mono">Sign In</button>
        </form>

        <footer class="mt-8">
            <p class="text-[10px] data-mono text-teal-500/10">v2.0.1-LTS</p>
        </footer>
    </div>
</body>
</html>
