<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>rpatch · Sign in</title>
<link rel="icon" type="image/png" href="/favicon.png">
<link href="/assets/css/fonts.css" rel="stylesheet">
<link href="/assets/css/app.css" rel="stylesheet">
</head>
<body>
<main>
  <form class="card" id="login-form">
    <h1><img src="/assets/img/logo.png" alt="">rpatch</h1>
    <div class="field">
      <label for="token">Admin token</label>
      <input type="password" id="token" name="token" autocomplete="current-password" required autofocus>
    </div>
    <p id="login-error" class="err" role="alert"></p>
    <button type="submit" class="primary wide">Sign in</button>
  </form>
</main>
<script>
document.getElementById('login-form').addEventListener('submit', async (event) => {
  event.preventDefault();
  const errorEl = document.getElementById('login-error');
  errorEl.textContent = '';
  try {
    const res = await fetch('/api/v1/admin/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token: document.getElementById('token').value }),
    });
    if (res.ok) { location.href = '/'; return; }
    errorEl.textContent = res.status === 429 ? 'Too many attempts. Wait a minute.' : 'Invalid token';
  } catch (err) {
    errorEl.textContent = 'Connection failed. Please try again.';
  }
});
</script>
</body>
</html>
