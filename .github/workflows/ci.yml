name: CI - Security & Quality

on:
  push:
    branches: [ main, v2_test ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    name: Linting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
      
      - name: golangci-lint (Server)
        uses: golangci/golangci-lint-action@v4
        with:
          version: latest
          working-directory: server
          args: --timeout=5m

      - name: golangci-lint (Agent)
        uses: golangci/golangci-lint-action@v4
        with:
          version: latest
          working-directory: agent
          args: --timeout=5m

  security:
    name: Security Scans
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Install Tools
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run Gosec (Server)
        run: gosec ./...
        working-directory: server

      - name: Run Gosec (Agent)
        run: gosec ./...
        working-directory: agent

      - name: Run Govulncheck (Server)
        run: govulncheck ./...
        working-directory: server

      - name: Run Govulncheck (Agent)
        run: govulncheck ./...
        working-directory: agent

  test:
    name: Unit Tests & Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Test Server with Coverage
        run: |
          go test -v -coverprofile=coverage.out ./...
          go tool cover -func=coverage.out -o=coverage.out
          # Feature 85: Enforce 80% coverage
          total_coverage=$(grep total coverage.out | awk '{print $3}' | sed 's/%//')
          if (( $(echo "$total_coverage < 80.0" | bc -l) )); then
            echo "Coverage is $total_coverage%. Must be >= 80.0%"
            exit 1
          fi
        working-directory: server

      - name: Test Agent
        run: go test -v ./...
        working-directory: agent

  chaos_test:
    name: Chaos Engineering Tests
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: patchli
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      
      - name: Install Pumba (Chaos tool)
        run: |
          curl -sL https://github.com/alexei-led/pumba/releases/download/0.9.0/pumba_linux_amd64 -o pumba
          chmod +x pumba
          sudo mv pumba /usr/local/bin/

      - name: Build Server
        run: go build -o server_bin ./main.go
        working-directory: server

      - name: Run Server in Background
        run: ./server/server_bin &
        env:
          DB_URL: postgres://postgres:password@localhost:5432/patchli?sslmode=disable
          REDIS_URL: localhost:6379

      - name: Chaos Test - Kill Redis
        run: |
          sleep 5 # Wait for server to start
          echo "Simulating Redis failure..."
          # Target the redis container specifically created by GitHub Actions service
          REDIS_CONTAINER=$(docker ps -q --filter label=com.docker.compose.service=redis || docker ps -q --filter ancestor=redis:7-alpine | head -n 1)
          if [ -n "$REDIS_CONTAINER" ]; then
            docker stop "$REDIS_CONTAINER"
          else
            echo "Failed to find Redis container"
            exit 1
          fi

          # Attempt health check while Redis is down to see if server handles it
          curl -s -f --retry 3 --retry-delay 2 http://localhost:8080/health || echo "Health check handled Redis down state"

          sleep 5
          docker start "$REDIS_CONTAINER"
          echo "Redis restored. Server should recover."

          # Active health check to assert recovery
          for i in {1..15}; do
            if curl -s -f http://localhost:8080/health | grep -q "OK"; then
              echo "Recovery verified!"
              exit 0
            fi
            echo "Waiting for recovery..."
            sleep 2
          done
          echo "Failed to recover."
          exit 1
