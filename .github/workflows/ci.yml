name: CI - Security & Quality

on:
  push:
    branches: [ main, v2_test ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    name: Linting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.9'
          cache: true
      
      - name: golangci-lint (Server)
        uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.14.0
          working-directory: server
          args: --timeout=5m

      - name: golangci-lint (Agent)
        uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.14.0
          working-directory: agent
          args: --timeout=5m

  security:
    name: Security Scans
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.9'

      - name: Install Tools
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@7b1b5cebe007d62fb58eacb90fc571112939ec30
          go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run Gosec (Server)
        run: gosec ./...
        working-directory: server

      - name: Run Gosec (Agent)
        run: gosec ./...
        working-directory: agent

      - name: Run Govulncheck (Server)
        run: govulncheck ./...
        working-directory: server

      - name: Run Govulncheck (Agent)
        run: govulncheck ./...
        working-directory: agent

  test:
    name: Unit Tests & Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.9'

      - name: Test Server with Coverage
        run: |
          go test -v -coverprofile=coverage.out ./...
          go tool cover -func=coverage.out -o=coverage.out
          # Feature 85: Enforce 80% coverage
          total_coverage=$(grep total coverage.out | awk '{print $3}' | sed 's/%//')
          echo "Total Coverage: $total_coverage%"
          awk -v cov="$total_coverage" 'BEGIN { if (cov < 80.0) { print "Coverage is " cov "%. Must be >= 80.0%"; exit 1 } }'
        working-directory: server

      - name: Test Agent
        run: go test -v ./...
        working-directory: agent

  chaos_test:
    name: Chaos Engineering Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: patchli
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d patchli"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.9'
      
      - name: Build Server
        run: go build -o server_bin ./cmd/patchli-server/main.go
        working-directory: server

      - name: Run Server in Background
        run: |
          ./server/server_bin &
          SERVER_PID=$!
          echo "SERVER_PID=$SERVER_PID" >> $GITHUB_ENV
          # Wait for server to be healthy and responsive
          for i in {1..15}; do
            RESPONSE=$(curl -s http://localhost:8080/health 2>/dev/null) || true
            if echo "$RESPONSE" | grep -qi "ok\|healthy\|alive\|running"; then
              echo "Server is healthy and responsive (attempt $i)"
              break
            fi
            if [ "$i" -eq 15 ]; then
              echo "Server failed to become healthy after 30s"
              exit 1
            fi
            sleep 2
          done
        env:
          DB_URL: postgres://postgres:password@localhost:5432/patchli?sslmode=disable
          JWT_SECRET: "ci-only-jwt-secret-not-used-in-production"
          REGISTRATION_SECRET: "ci-only-registration-secret-not-used-in-production"

      - name: Chaos Test - PostgreSQL outage and recovery
        run: |
          docker stop ${{ job.services.postgres.id }}
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/health)
          if [ "$STATUS" != 503 ]; then
            echo "Expected unavailable (503) but got $STATUS"
            exit 1
          fi
          docker start ${{ job.services.postgres.id }}
          for attempt in {1..15}; do
            if curl -fsS http://localhost:8080/health; then
              exit 0
            fi
            sleep 2
          done
          echo "Server did not recover after PostgreSQL restart"
          exit 1

      - name: Cleanup Server Process
        if: always()
        run: |
          if [ -n "$SERVER_PID" ]; then
            kill $SERVER_PID 2>/dev/null || true
          fi

  fuzz_test:
    name: Fuzz Testing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.9'
      
      - name: Fuzz WebSocket Parser
        run: go test -fuzz=FuzzMessage -fuzztime=1m ./internal/websocket
        working-directory: server

  deadlock_detection:
    name: Deadlock Detection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.9'
      
      - name: Run Tests with Deadlock Detector
        run: go test -v -race ./...
        working-directory: server
