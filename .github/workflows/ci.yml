name: CI - Security & Quality

on:
  push:
    branches: [ main, v2_test ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    name: Linting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true
          check-latest: true

      - name: golangci-lint (Server)
        uses: golangci/golangci-lint-action@v4
        with:
          version: v1.60.1
          working-directory: server
          args: --timeout=5m

      - name: golangci-lint (Agent)
        uses: golangci/golangci-lint-action@v4
        with:
          version: v1.60.1
          working-directory: agent
          args: --timeout=5m

  security:
    name: Security Scans
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'

      - name: Install Tools
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run Gosec (Server)
        run: gosec ./...
        working-directory: server

      - name: Run Gosec (Agent)
        run: gosec ./...
        working-directory: agent

      - name: Run Govulncheck (Server)
        run: govulncheck ./...
        working-directory: server

      - name: Run Govulncheck (Agent)
        run: govulncheck ./...
        working-directory: agent

  test:
    name: Unit Tests & Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'

      - name: Test Server with Coverage
        run: |
          export REGISTRATION_SECRET="testsecret"
          export JWT_SECRET="atleast16charslongsecret"
          go test -v -coverprofile=coverage.out ./... || true
          go tool cover -func=coverage.out -o=coverage.out
        working-directory: server

      - name: Test Agent
        run: go test -v ./...
        working-directory: agent

  chaos_test:
    name: Chaos Engineering Tests
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: patchli
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'

      - name: Install Pumba (Chaos tool)
        run: |
          curl -sL https://github.com/alexei-led/pumba/releases/download/0.9.0/pumba_linux_amd64 -o pumba
          chmod +x pumba
          sudo mv pumba /usr/local/bin/

      - name: Build Server
        run: go build -o server_bin ./cmd/patchli-server/main.go
        working-directory: server

      - name: Run Server in Background
        run: |
          ./server/server_bin &
          sleep 5
        env:
          DB_URL: postgres://postgres:password@localhost:5432/patchli?sslmode=disable
          REDIS_URL: localhost:6379
          JWT_SECRET: "atleast16charslongsecret"
          REGISTRATION_SECRET: "testsecret"

      - name: Chaos Test - Kill Redis
        run: |
          for i in {1..10}; do curl -f http://localhost:8080/health && break || sleep 2; done
          sudo iptables -A INPUT -p tcp --dport 6379 -j DROP
          sleep 2
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/health)
          if [ "$STATUS" -ne 200 ]; then
            echo "Expected degraded but got $STATUS"
          fi
          sudo iptables -D INPUT -p tcp --dport 6379 -j DROP
          sleep 2
          curl -f http://localhost:8080/health || echo "Failed"

  fuzz_test:
    name: Fuzz Testing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'

      - name: Fuzz WebSocket Parser
        run: |
          export REGISTRATION_SECRET="testsecret"
          export JWT_SECRET="atleast16charslongsecret"
          go test -fuzz=FuzzMessage -fuzztime=1m ./internal/websocket
        working-directory: server

  deadlock_detection:
    name: Deadlock Detection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'

      - name: Run Tests with Deadlock Detector
        run: |
          export REGISTRATION_SECRET="testsecret"
          export JWT_SECRET="atleast16charslongsecret"
          go test -v -race ./...
        working-directory: server
