name: CI - Security & Quality

on:
  push:
    branches: [ main, v2_test ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    name: Linting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
      
      - name: golangci-lint (Server)
        uses: golangci/golangci-lint-action@v4
        with:
          version: latest
          working-directory: server
          args: --timeout=5m

      - name: golangci-lint (Agent)
        uses: golangci/golangci-lint-action@v4
        with:
          version: latest
          working-directory: agent
          args: --timeout=5m

  security:
    name: Security Scans
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Install Tools
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run Gosec (Server)
        run: gosec ./...
        working-directory: server

      - name: Run Gosec (Agent)
        run: gosec ./...
        working-directory: agent

      - name: Run Govulncheck (Server)
        run: govulncheck ./...
        working-directory: server

      - name: Run Govulncheck (Agent)
        run: govulncheck ./...
        working-directory: agent

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Test Server
        run: go test -v ./...
        working-directory: server

      - name: Test Agent
        run: go test -v ./...
        working-directory: agent
